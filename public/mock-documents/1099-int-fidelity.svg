<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mock 1099-INT Fidelity">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eef0f4" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#ffffff"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <rect x="24" y="24" width="752" height="80" fill="#eef4fb" stroke="#8fa8c2"/>
  <text x="40" y="60" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Form 1099-INT · Interest Income</text>
  <text x="40" y="82" font-family="Arial" font-size="12" fill="#475569">Tax year 2025 · Fidelity Brokerage Services LLC</text>

  <g font-family="Arial" fill="#0f172a">
    <rect x="24" y="120" width="370" height="90" fill="#ffffff" stroke="#c9d3e0"/>
