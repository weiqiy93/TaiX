<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mock 1098 with low-quality scan">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eef0f4" stroke-width="0.5"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 0 0.85 0 0 0 0.3 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs>
  <rect width="800" height="1000" fill="#f3f0ea"/>
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.6"/>

  <rect x="24" y="24" width="752" height="80" fill="#e8dfd0" stroke="#a1927b"/>
  <text x="40" y="60" font-family="Arial" font-size="18" font-weight="700" fill="#1f1a12">Form 1098 · Mortgage Interest Statement</text>
  <text x="40" y="82" font-family="Arial" font-size="12" fill="#4b3f2b">Tax year 2025 · Home Loan Mortgage Co.</text>

  <g font-family="Arial" fill="#1f1a12">
    <rect x="24" y="120" width="370" height="90" fill="#ffffff" stroke="#a1927b"/>
    <text x="34" y="138" font-size="10" fill="#64748b">Lender / Payer of interest</text>
    <text x="34" y="162" font-size="14" font-weight="700">Home Loan Mortgage Co.</text>
    <text x="34" y="180" font-size="12" fill="#3f3524">1500 Lending Way</text>
    <text x="34" y="198" font-size="12" fill="#3f3524">Charlotte, NC 28202</text>

    <rect x="410" y="120" width="366" height="90" fill="#ffffff" stroke="#a1927b"/>
    <text x="420" y="138" font-size="10" fill="#64748b">Borrower</text>
    <text x="420" y="162" font-size="14" font-weight="700">John Smith</text>
    <text x="420" y="180" font-size="12" fill="#3f3524">Loan ****7712</text>
    <text x="420" y="198" font-size="12" fill="#3f3524">TIN ***-**-4821</text>
  </g>

  <g font-family="Arial">
    <rect x="24" y="320" width="440" height="120" fill="#fdf6df" stroke="#c1a53b"/>
    <text x="34" y="342" font-size="11" fill="#64748b">Box 1 · Mortgage interest received from payer(s)</text>
    <g filter="url(#blur)">
      <text x="34" y="404" font-size="34" font-weight="700" fill="#1f1a12" letter-spacing="1">14,2</text>
      <text x="112" y="404" font-size="34" font-weight="700" fill="#1f1a12" opacity="0.55" letter-spacing="1">3</text>
      <text x="140" y="404" font-size="34" font-weight="700" fill="#1f1a12" opacity="0.45" letter-spacing="1">0</text>
      <text x="176" y="404" font-size="24" fill="#1f1a12">.00</text>
    </g>
    <!-- OCR wrong reading annotation -->
    <text x="220" y="418" font-family="Arial" font-size="10" fill="#a35b00">OCR guessed 14,320 · low confidence</text>
    <!-- scratches -->
    <line x1="30" y1="410" x2="230" y2="405" stroke="#8b6a2f" stroke-width="0.6" opacity="0.35"/>
    <line x1="40" y1="420" x2="220" y2="418" stroke="#8b6a2f" stroke-width="0.5" opacity="0.3"/>

    <rect x="480" y="320" width="296" height="120" fill="#ffffff" stroke="#a1927b"/>
    <text x="490" y="342" font-size="11" fill="#64748b">Box 2 · Outstanding mortgage principal</text>
    <text x="490" y="404" font-size="22" fill="#1f1a12">312,455.00</text>

    <rect x="24" y="460" width="752" height="90" fill="#ffffff" stroke="#a1927b"/>
    <text x="34" y="482" font-size="11" fill="#64748b">Box 3 · Mortgage origination date</text>
    <text x="34" y="524" font-size="22" fill="#1f1a12">2018-05-14</text>

    <rect x="24" y="560" width="376" height="90" fill="#ffffff" stroke="#a1927b"/>
    <text x="34" y="582" font-size="11" fill="#64748b">Box 6 · Points paid on purchase</text>
    <text x="34" y="624" font-size="22" fill="#1f1a12">0.00</text>

    <rect x="410" y="560" width="366" height="90" fill="#ffffff" stroke="#a1927b"/>
    <text x="420" y="582" font-size="11" fill="#64748b">Box 11 · Mortgage acquisition date</text>
    <text x="420" y="624" font-size="22" fill="#1f1a12">—</text>
  </g>

  <!-- overall grain/aging -->
  <rect width="800" height="1000" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
