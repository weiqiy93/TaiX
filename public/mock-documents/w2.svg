<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mock W-2 document">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eef0f4" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#ffffff"/>
  <rect width="800" height="1000" fill="url(#grid)"/>

  <rect x="24" y="24" width="752" height="80" fill="#f4f7fb" stroke="#c9d3e0"/>
  <text x="40" y="60" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Form W-2 · Wage and Tax Statement</text>
  <text x="40" y="82" font-family="Arial" font-size="12" fill="#475569">Tax year 2025 · OMB No. 1545-0008</text>
  <text x="640" y="60" font-family="Arial" font-size="12" fill="#475569">Copy B – To be filed with</text>
  <text x="640" y="76" font-family="Arial" font-size="12" fill="#475569">employee's federal return</text>

  <!-- Employer / employee blocks -->
  <g font-family="Arial" fill="#0f172a">
    <rect x="24" y="120" width="370" height="90" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="34" y="138" font-size="10" fill="#64748b">c. Employer name, address, and ZIP code</text>
    <text x="34" y="162" font-size="14" font-weight="700">Acme Corporation</text>
    <text x="34" y="180" font-size="12" fill="#334155">400 Market Street</text>
    <text x="34" y="196" font-size="12" fill="#334155">San Francisco, CA 94105</text>

    <rect x="410" y="120" width="180" height="90" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="420" y="138" font-size="10" fill="#64748b">b. Employer EIN</text>
    <text x="420" y="164" font-size="14">94-2841027</text>

    <rect x="606" y="120" width="170" height="90" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="616" y="138" font-size="10" fill="#64748b">a. Employee SSN</text>
    <text x="616" y="164" font-size="14">***-**-4821</text>
  </g>

  <!-- Numeric boxes -->
  <g font-family="Arial">
    <rect x="24" y="230" width="380" height="70" fill="#fff8e6" stroke="#d19b1a"/>
    <text x="34" y="250" font-size="11" fill="#64748b">1. Wages, tips, other compensation</text>
    <text x="34" y="286" font-size="26" font-weight="700" fill="#0f172a">85,240.00</text>

    <rect x="410" y="230" width="180" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="420" y="250" font-size="11" fill="#64748b">2. Federal income tax withheld</text>
    <text x="420" y="286" font-size="22" font-weight="600" fill="#0f172a">13,830.00</text>

    <rect x="606" y="230" width="170" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="616" y="250" font-size="11" fill="#64748b">3. Social security wages</text>
    <text x="616" y="286" font-size="20" font-weight="600" fill="#0f172a">85,240.00</text>

    <rect x="24" y="310" width="380" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="34" y="330" font-size="11" fill="#64748b">4. Social security tax withheld</text>
    <text x="34" y="366" font-size="20" font-weight="600" fill="#0f172a">5,284.88</text>

    <rect x="410" y="310" width="180" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="420" y="330" font-size="11" fill="#64748b">5. Medicare wages and tips</text>
    <text x="420" y="366" font-size="20" font-weight="600" fill="#0f172a">85,240.00</text>

    <rect x="606" y="310" width="170" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="616" y="330" font-size="11" fill="#64748b">6. Medicare tax withheld</text>
    <text x="616" y="366" font-size="20" font-weight="600" fill="#0f172a">1,235.98</text>

    <rect x="24" y="390" width="752" height="70" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="34" y="410" font-size="11" fill="#64748b">7-11. Other compensation</text>
    <text x="34" y="446" font-size="14" fill="#334155">—</text>

    <rect x="24" y="470" width="752" height="140" fill="#f8fafc" stroke="#c9d3e0"/>
    <text x="34" y="490" font-size="11" fill="#64748b">15-20. State and local information</text>
    <text x="34" y="518" font-size="14" fill="#334155">CA · State wages 85,240.00 · State tax 4,124.11</text>

    <rect x="24" y="620" width="752" height="180" fill="#ffffff" stroke="#c9d3e0"/>
    <text x="34" y="640" font-size="11" fill="#64748b">Notes for filer</text>
    <text x="34" y="666" font-size="12" fill="#334155">This is a mock W-2 rendered as SVG. Digits are printed cleanly to represent a</text>
    <text x="34" y="682" font-size="12" fill="#334155">high-confidence OCR extraction.</text>
  </g>
</svg>
